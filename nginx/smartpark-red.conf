# SmartPark-RED :: vhost para o nginx-master da VPS
# Local de destino na VPS: /mcorecloud/nginx-master/conf.d/smartpark-red.conf
# smartpark_nodered e smartpark_mosquitto precisam estar na rede externa
# "mcorecloud-network" (já garantido pelo docker-compose.yml deste projeto).

server {
    listen 80;
    server_name smartpark-red.sytes.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name smartpark-red.sytes.net;

    ssl_certificate /etc/letsencrypt/live/smartpark-red.sytes.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartpark-red.sytes.net/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

    # Editor de flows em /admin-red — protegido por login (adminAuth em
    # nodered/settings.js), servido via HTTPS por este mesmo proxy.
    location / {
        proxy_pass http://smartpark_nodered:1880;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # MQTT sobre WebSocket (usado pelo Monitor MQTT em /monitor) — TLS
    # terminado aqui pelo Nginx, repassado sem criptografia ao listener
    # 9001 do Mosquitto na rede interna.
    location /mqtt-ws {
        proxy_pass http://smartpark_mosquitto:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
