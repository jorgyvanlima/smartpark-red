
# SmartPark-RED :: Eclipse Mosquitto

listener 1883 0.0.0.0
protocol mqtt

# Listener extra por WebSocket (útil para dashboards/paineis web, opcional)
listener 9001 0.0.0.0
protocol websockets

# Conexões locais e externas anônimas (padrão para o cenário acadêmico:
# ESP32/Wokwi, Node-RED e o app mobile publicam/assinam sem credenciais).
# Para reforçar depois: trocar para "allow_anonymous false" + password_file
# gerado com "mosquitto_passwd -b -c passwd <user> <pass>".
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_timestamp true

connection_messages true
